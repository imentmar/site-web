<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <title>Administration</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <h1 class="mb-4">
        Ajouter un produit
    </h1>

    <form method="POST"
          enctype="multipart/form-data">

        <div class="mb-3">

            <label class="form-label">
                Nom du produit
            </label>

            <input
                type="text"
                name="name"
                class="form-control"
                required>

        </div>

        <div class="mb-3">

            <label class="form-label">
                Description (optionnelle)
            </label>

            <textarea
                name="description"
                class="form-control">
            </textarea>

        </div>

        <div class="mb-3">

            <label class="form-label">
                Prix
            </label>

            <input
                type="number"
                step="0.01"
                name="price"
                class="form-control"
                required>

        </div>

        <div class="mb-3">

            <label class="form-label">
                Catégorie
            </label>

            <select
                name="category"
                class="form-select">

                <option>Bracelets</option>
                <option>Colliers</option>
                <option>Bagues</option>
                <option>Chaînes de main</option>
                <option>Chevillères</option>
                <option>Boucles d'oreilles</option>

            </select>

        </div>

        <div class="mb-3">

            <label class="form-label">
                Image
            </label>

            <input
                type="file"
                name="image"
                class="form-control">

        </div>

        <button
            type="submit"
            class="btn btn-primary">

            Ajouter

        </button>

    </form>

</div>

</body>
</html>
